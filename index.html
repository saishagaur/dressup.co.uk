<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Visual Avatar Creator</title>

<style>
/* =========================================================
VISUAL AVATAR CREATOR
One HTML file: HTML + CSS + JavaScript
========================================================= */

* {
box-sizing: border-box;
}

:root {
--bg: #f4f5f9;
--panel: #ffffff;
--text: #20222a;
--muted: #747887;
--border: #e1e3ea;
--accent: #6957e8;
--accent-light: #eeeaff;
--shadow: 0 12px 35px rgba(30, 32, 50, .10);
--radius: 20px;
}

body {
margin: 0;
min-height: 100vh;
background: var(--bg);
color: var(--text);
font-family:
system-ui,
-apple-system,
BlinkMacSystemFont,
"Segoe UI",
sans-serif;
}

button {
font: inherit;
}


/* =========================================================
HEADER
========================================================= */

header {
position: sticky;
top: 0;
z-index: 50;

background: rgba(255,255,255,.96);
backdrop-filter: blur(10px);

border-bottom: 1px solid var(--border);
padding: 15px 20px;
}

.header-inner {
max-width: 1400px;
margin: auto;

display: flex;
align-items: center;
justify-content: space-between;
gap: 15px;
}

.logo {
display: flex;
align-items: center;
gap: 11px;
}

.logo-icon {
width: 45px;
height: 45px;

display: grid;
place-items: center;

background: var(--accent-light);
border-radius: 14px;

font-size: 25px;
}

.logo h1 {
margin: 0;
font-size: 19px;
}

.logo p {
margin: 2px 0 0;
color: var(--muted);
font-size: 12px;
}

.header-actions {
display: flex;
gap: 7px;
}


/* =========================================================
BUTTONS
========================================================= */

.action-button {
border: 1px solid var(--border);
background: white;
color: var(--text);

border-radius: 11px;
padding: 10px 14px;

cursor: pointer;

transition: .15s ease;
}

.action-button:hover {
transform: translateY(-1px);
border-color: #c8c9d5;
}

.primary-button {
background: var(--accent);
color: white;
border-color: var(--accent);
}

.primary-button:hover {
background: #5645d0;
}


/* =========================================================
MAIN LAYOUT
========================================================= */

.app {
max-width: 1400px;
margin: auto;
padding: 22px;

display: grid;
grid-template-columns:
minmax(350px, .9fr)
minmax(500px, 1.1fr);

gap: 22px;
}

.preview-panel,
.controls-panel {
background: var(--panel);
border: 1px solid var(--border);
border-radius: var(--radius);
box-shadow: var(--shadow);
}


/* =========================================================
PREVIEW
========================================================= */

.preview-panel {
min-height: calc(100vh - 110px);

position: sticky;
top: 90px;

display: flex;
flex-direction: column;
}

.preview-header {
padding: 17px 20px;

display: flex;
align-items: center;
justify-content: space-between;

border-bottom: 1px solid var(--border);
}

.preview-header h2 {
margin: 0;
font-size: 16px;
}

.preview-area {
flex: 1;

display: grid;
place-items: center;

padding: 25px;

background:
radial-gradient(
circle at center,
#fff 0%,
#faf9ff 55%,
#f0eeff 100%
);

border-radius: 0 0 var(--radius) var(--radius);
}

#avatar {
width: min(100%, 470px);
height: auto;

filter:
drop-shadow(
0 22px 25px
rgba(40,40,70,.13)
);
}

.toolbar {
display: flex;
gap: 6px;
}

.small-button {
width: 36px;
height: 36px;

border: 1px solid var(--border);
border-radius: 10px;

background: white;

cursor: pointer;
}

.small-button:disabled {
opacity: .3;
cursor: not-allowed;
}


/* =========================================================
CONTROLS
========================================================= */

.controls-panel {
padding: 20px;
}

.section {
margin-bottom: 28px;
}

.section-header {
display: flex;
align-items: center;
gap: 9px;
margin-bottom: 10px;
}

.section-number {
width: 27px;
height: 27px;

display: grid;
place-items: center;

border-radius: 50%;

background: var(--accent-light);
color: var(--accent);

font-size: 12px;
font-weight: 800;
}

.section-header h3 {
margin: 0;
font-size: 19px;
}


/* =========================================================
VISUAL OPTION GRID
========================================================= */

.option-grid {
display: grid;

grid-template-columns:
repeat(auto-fill, minmax(88px, 1fr));

gap: 9px;
}


/*
IMPORTANT:
There is intentionally no visible text inside these
buttons. The picture is the selection.
*/

.option {
min-height: 88px;

padding: 5px;

display: grid;
place-items: center;

border: 2px solid transparent;
border-radius: 15px;

background: #fafafd;

cursor: pointer;

transition:
transform .15s ease,
border-color .15s ease,
background .15s ease;
}

.option:hover {
transform: translateY(-2px);
background: #f4f1ff;
}

.option.selected {
border-color: var(--accent);
background: var(--accent-light);

box-shadow:
0 0 0 3px
rgba(105,87,232,.08);
}

.option:focus-visible {
outline: 3px solid
rgba(105,87,232,.3);

outline-offset: 2px;
}

.option svg {
width: 100%;
height: 78px;
}


/* =========================================================
COLOUR SWATCHES
========================================================= */

.colour-option {
min-height: 65px;
}

.colour-circle {
width: 43px;
height: 43px;

border-radius: 50%;

border: 3px solid rgba(0,0,0,.08);

box-shadow:
inset 0 0 0 1px
rgba(255,255,255,.3);
}

.colour-option.selected
.colour-circle {
box-shadow:
0 0 0 3px white,
0 0 0 5px var(--accent);
}


/* =========================================================
EXPORT
========================================================= */

.export-area {
padding-top: 20px;
border-top: 1px solid var(--border);

display: grid;
grid-template-columns: 1fr 1fr;

gap: 9px;
}

.export-area button {
padding: 13px;
}


/* =========================================================
MOBILE
========================================================= */

@media (max-width: 950px) {

.app {
grid-template-columns: 1fr;
}

.preview-panel {
position: relative;
top: auto;
min-height: auto;
}

.preview-area {
min-height: 430px;
}
}

@media (max-width: 600px) {

header {
padding: 11px 13px;
}

.logo p {
display: none;
}

.header-actions span {
display: none;
}

.app {
padding: 11px;
gap: 12px;
}

.controls-panel {
padding: 14px;
}

.preview-area {
min-height: 370px;
padding: 12px;
}

.option-grid {
grid-template-columns:
repeat(auto-fill, minmax(72px, 1fr));
}

.option {
min-height: 76px;
}

.option svg {
height: 67px;
}

.export-area {
grid-template-columns: 1fr;
}
}
</style>
</head>

/* =========================================================
GENERATE VISUAL OPTIONS
========================================================= */

function createOptions() {

document
.querySelectorAll("[data-category]")
.forEach(grid => {

const category =
grid.dataset.category;

grid.innerHTML = "";

for (
let i = 0;
i < optionCounts[category];
i++
) {

const button =
document.createElement("button");

button.type = "button";
button.className = "option";

button.dataset.index = i;

/*
These descriptions are available to
assistive technology but are NOT shown
visually.
*/

button.setAttribute(
"aria-label",
`${category} visual option ${i + 1}`
);

let content = "";

switch (category) {

case "face":
content =
faceThumbnail(i);
break;

case "skin":
content =
skinThumbnail(i);
break;

case "hairColor":
content =
hairColourThumbnail(i);
break;

case "hair":
content =
hairThumbnail(i);
break;

case "eyes":
content =
eyeThumbnail(i);
break;

case "nose":
content =
noseThumbnail(i);
break;

case "mouth":
content =
mouthThumbnail(i);
break;

case "ears":
content =
earThumbnail(i);
break;

case "accessory":
content =
accessoryThumbnail(i);
break;

case "clothes":
content =
clothesThumbnail(i);
break;

case "clothesColor":
content = `
<svg
viewBox="0 0 100 70"
xmlns="http://www.w3.org/2000/svg">

<circle
cx="50"
cy="35"
r="23"
fill="${clothesColours[i]}"
stroke="rgba(0,0,0,.12)"
stroke-width="2"/>
</svg>
`;
break;

case "shoes":
content =
shoeThumbnail(i);
break;
}

button.innerHTML = content;

button.addEventListener(
"click",
() => {

saveHistory();

state[category] = i;

render();

}
);

grid.appendChild(button);
}
});
}

/* =========================================================
UPDATE SELECTIONS
========================================================= */

function updateSelectedOptions() {

document
.querySelectorAll("[data-category]")
.forEach(grid => {

const category =
grid.dataset.category;

grid
.querySelectorAll(".option")
.forEach((button, index) => {

const selected =
index ===
state[category];

button.classList.toggle(
"selected",
selected
);

button.setAttribute(
"aria-pressed",
selected
);

});
});
}


/*
Because the visual thumbnails depend on things like
current skin/hair colour, regenerate them whenever
the character changes.
*/

function refreshOptionImages() {

createOptions();
updateSelectedOptions();

}


/* =========================================================
RENDER EVERYTHING
========================================================= */

function render() {

renderAvatar();

refreshOptionImages();

updateHistoryButtons();

}


/* =========================================================
HISTORY
========================================================= */

function saveHistory() {

history =
history.slice(
0,
historyIndex + 1
);

history.push(
cloneState(state)
);

historyIndex =
history.length - 1;

updateHistoryButtons();
}


function updateHistoryButtons() {

document
.getElementById("undoButton")
.disabled =
historyIndex <= 0;

document
.getElementById("redoButton")
.disabled =
historyIndex >=
history.length - 1;
}


document
.getElementById("undoButton")
.addEventListener(
"click",
() => {

if (
historyIndex <= 0
) return;

historyIndex--;

state =
cloneState(
history[historyIndex]
);

render();

}
);


document
.getElementById("redoButton")
.addEventListener(
"click",
() => {

if (
historyIndex >=
history.length - 1
) return;

historyIndex++;

state =
cloneState(
history[historyIndex]
);

render();

}
);


/* =========================================================
RANDOM
========================================================= */

document
.getElementById("randomButton")
.addEventListener(
"click",
() => {

saveHistory();

Object.keys(state)
.forEach(category => {

state[category] =
Math.floor(
Math.random() *
optionCounts[category]
);

});

render();

}
);


/* =========================================================
RESET
========================================================= */

document
.getElementById("resetButton")
.addEventListener(
"click",
() => {

saveHistory();

state =
cloneState(
defaultState
);

render();

}
);


/* =========================================================
DOWNLOAD SVG
========================================================= */

document
.getElementById("svgButton")
.addEventListener(
"click",
() => {

const svg =
document.getElementById(
"avatar"
);

const clone =
svg.cloneNode(true);

clone.setAttribute(
"xmlns",
"http://www.w3.org/2000/svg"
);

const source =
new XMLSerializer()
.serializeToString(
clone
);

const blob =
new Blob(
[source],
{
type:
"image/svg+xml"
}
);

const url =
URL.createObjectURL(blob);

const link =
document.createElement("a");

link.href = url;

link.download =
"my-avatar.svg";

document.body.appendChild(link);

link.click();

link.remove();

URL.revokeObjectURL(url);

}
);


/* =========================================================
DOWNLOAD PNG
========================================================= */

document
.getElementById("pngButton")
.addEventListener(
"click",
() => {

const svg =
document.getElementById(
"avatar"
);

const clone =
svg.cloneNode(true);

clone.setAttribute(
"xmlns",
"http://www.w3.org/2000/svg"
);

const source =
new XMLSerializer()
.serializeToString(
clone
);

const blob =
new Blob(
[source],
{
type:
"image/svg+xml"
}
);

const url =
URL.createObjectURL(blob);

const image =
new Image();

image.onload =
function () {

const canvas =
document.createElement(
"canvas"
);

canvas.width = 1000;
canvas.height = 1300;

const ctx =
canvas.getContext("2d");

ctx.drawImage(
image,
0,
0,
1000,
1300
);

URL.revokeObjectURL(url);

canvas.toBlob(
blob => {

const pngURL =
URL.createObjectURL(
blob
);

const link =
document.createElement(
"a"
);

link.href =
pngURL;

link.download =
"my-avatar.png";

document.body
.appendChild(
link
);

link.click();

link.remove();

URL.revokeObjectURL(
pngURL
);

},
"image/png"
);

};

image.src = url;

}
);


/* =========================================================
KEYBOARD SHORTCUTS
========================================================= */

document.addEventListener(
"keydown",
event => {

if (
(event.ctrlKey ||
event.metaKey) &&
event.key.toLowerCase() === "z"
) {

event.preventDefault();

if (event.shiftKey) {

document
.getElementById(
"redoButton"
)
.click();

} else {

document
.getElementById(
"undoButton"
)
.click();
