 <div id="face">

 </div>

</div>

</div>
  <div id="shoes">

<style>


body {
background: pink;
text-align: center;
font-family: Arial;
}
h1 {
color: purple;
}

button {
padding: 12px;
margin: 5px;
border-radius: 10px;
border: none;
background: purple;
color: white;
}
#hair {
width: 250px;
height: 75px;
background: brown;
border-radius: 50% 50% 20% 20%;
position: relative;
left: 50%;
transform: translateX(-50%);
top: 130px;
} 
#face {
width: 250px;
height: 300px;
background: peachpuff;
border-radius: 50%;
margin: 30px auto;
position: relative;
}

#eye1,
#eye2 {
width: 30px;
height: 30px;
background: black;
border-radius: 50%;
position: absolute;
top: 100px;
}

#eye1 {
left: 60px;
}

#eye2 {
right: 60px;
}

#mouth {
width: 70px;
height: 30px;
border-bottom: 5px solid red;
border-radius: 50%;
position: absolute;
left: 90px;
top: 190px;
}

 #clothes {
width: 350px;
height: 500px;
background: brown;
border-radius: 50% 50% 20% 20%;
position: relative;
left: 50%;
transform: translateX(-50%);
top: 130px;
} 

 #shoes {
width: 100px;
height: 50px;
background: brown;
border-radius: 50% 50% 20% 20%;

left: 50%;
transform: translateX(-50%);
top: 130px;
} 

</style>

document.getElementById("eye2").style.height = "50px";

}
function brownHair() {
document.getElementById("hair").style.background = "brown";
}

function blackHair() {
document.getElementById("hair").style.background = "black";
}

function blondeHair() {
document.getElementById("hair").style.background = "gold";
}

</script>
